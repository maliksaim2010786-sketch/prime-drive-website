<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeDrive | Booking Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#eef2f7;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:32px 20px}h1{margin:0 0 8px}.sub{color:#9ca3af;margin-bottom:28px}.card{background:#1f2937;border:1px solid #374151;border-radius:12px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #374151;font-size:14px}th{color:#f97316}.empty{padding:40px;text-align:center;color:#9ca3af}.badge{color:#065f46;background:#a7f3d0;padding:4px 8px;border-radius:20px;font-size:12px}@media(max-width:800px){table{display:block;overflow-x:auto}}</style></head><body><div class="wrap"><h1>PrimeDrive Bookings</h1><p class="sub">All customer booking requests</p><div class="card"><table><thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Car</th><th>Service</th><th>Dates</th><th>Pickup → Drop-off</th><th>Total</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">Loading bookings...</div></div></div><script>const user='owner',password=prompt('Enter owner admin password:','');fetch('/api/bookings',{headers:{Authorization:'Basic '+btoa(user+':'+password)}}).then(async r=>{if(!r.ok)throw new Error(r.status===401?'Incorrect password':'Could not load bookings');return r.json()}).then(rows=>{const body=document.getElementById('rows'),empty=document.getElementById('empty');empty.remove();if(!rows.length){body.innerHTML='<tr><td colspan="9" class="empty">No booking requests yet.</td></tr>';return}body.innerHTML=rows.map(b=>`<tr><td>${b.id}</td><td>${escapeHtml(b.name)}</td><td><a style="color:#fff" href="tel:${b.phone}">${escapeHtml(b.phone)}</a></td><td>${escapeHtml(b.car)}</td><td>${escapeHtml(b.service)}</td><td>${b.pickupDate}<br>${b.returnDate}</td><td>${escapeHtml(b.pickup)} → ${escapeHtml(b.dropoff)}</td><td>Rs. ${Number(b.total).toLocaleString()}</td><td><span class="badge">${b.status}</span></td></tr>`).join('')}).catch(e=>document.getElementById('empty').textContent=e.message);function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":"&#39;",'"':'&quot;'}[c]))}</script></body></html>
